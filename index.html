<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL PAYMENT HANZ STORE - Payment Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1429 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(147, 112, 219, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideInDown 0.8s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #63f3d0 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: clamp(14px, 3vw, 18px);
            color: #a0aec0;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Main content */
        .content {
            flex: 1;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Payment methods grid */
        .payment-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (min-width: 768px) {
            .payment-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 24px;
            }
        }

        @media (min-width: 1024px) {
            .payment-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 28px;
            }
        }

        /* QRIS section - full width priority */
        .qris-section {
            grid-column: 1 / -1;
            margin-bottom: 20px;
            animation: slideInUp 0.8s ease-out 0.1s both;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card styles */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: slideInUp 0.8s ease-out;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            font-size: 28px;
        }

        /* QRIS Card */
        .qris-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qris-image-wrapper {
            width: 100%;
            max-width: 280px;
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            user-select: none;
            -webkit-user-select: none;
        }

        .qris-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qris-image-wrapper img:active {
            transform: scale(0.98);
        }

        .qris-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .qris-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #63f3d0;
        }

        .qris-info p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 4px;
        }

        .qris-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Button styles */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #63f3d0 0%, #6366f1 100%);
            color: #0a0e27;
            box-shadow: 0 8px 20px rgba(99, 243, 208, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(99, 243, 208, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        /* Payment method cards */
        .payment-card {
            display: flex;
            flex-direction: column;
            animation: slideInUp 0.8s ease-out;
        }

        .payment-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .payment-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .payment-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .payment-info {
            flex: 1;
            margin-bottom: 16px;
        }

        .payment-number {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            color: #63f3d0;
            word-break: break-all;
        }

        .payment-name {
            font-size: 13px;
            color: #a0aec0;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.4);
            color: #ffc107;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(99, 243, 208, 0.95);
            backdrop-filter: blur(10px);
            color: #0a0e27;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(99, 243, 208, 0.3);
            animation: slideInRight 0.3s ease-out;
            z-index: 1000;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        .toast.hide {
            animation: slideOutRight 0.3s ease-out;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #708090;
            font-size: 13px;
            margin-top: 40px;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }

            .header {
                margin-bottom: 40px;
            }

            .card {
                padding: 20px;
                border-radius: 20px;
            }

            .qris-image-wrapper {
                max-width: 240px;
            }

            .toast {
                bottom: 20px;
                right: 20px;
                left: 20px;
                max-width: calc(100% - 40px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>ALL PAYMENT HANZ STORE</h1>
            <p>Payment Center</p>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="payment-grid">
                <!-- QRIS Card -->
                <div class="qris-section">
                    <div class="card qris-card">
                        <div class="qris-image-wrapper">
                            <img id="qrisImage" src="assets/qris.jpg" alt="QRIS ALL PAYMENT" draggable="false">
                        </div>
                        <div class="qris-info">
                            <h3>QRIS ALL PAYMENT</h3>
                            <p>A/N Hanz Store</p>
                        </div>
                        <div class="qris-buttons">
                            <button class="btn btn-primary" onclick="downloadQRIS()">
                                ⬇️ Download QRIS
                            </button>
                        </div>
                    </div>
                </div>

                <!-- DANA Card -->
                <div class="payment-card">
                    <div class="card">
                        <div class="card-content">
                            <div class="card-title">
                                <span class="card-icon">💳</span>
                                DANA
                            </div>
                            <div class="payment-info">
                                <div class="payment-number">085191782145</div>
                                <div class="payment-name">A/N Na***</div>
                            </div>
                            <button class="btn btn-secondary" onclick="copyToClipboard('085191782145', 'DANA')">
                                📋 Salin Nomor
                            </button>
                        </div>
                    </div>
                </div>

                <!-- GoPay Card -->
                <div class="payment-card">
                    <div class="card">
                        <div class="card-content">
                            <div class="card-title">
                                <span class="card-icon">📱</span>
                                GoPay
                            </div>
                            <div class="payment-info">
                                <div class="payment-number">082269817663</div>
                                <div class="payment-name">A/N Han*P**</div>
                            </div>
                            <button class="btn btn-secondary" onclick="copyToClipboard('082269817663', 'GoPay')">
                                📋 Salin Nomor
                            </button>
                        </div>
                    </div>
                </div>

                <!-- OVO Card -->
                <div class="payment-card">
                    <div class="card">
                        <div class="card-content">
                            <div class="card-title">
                                <span class="card-icon">🛒</span>
                                OVO
                            </div>
                            <div class="payment-info">
                                <div class="payment-name">A/N NOT FOUND</div>
                                <div class="badge">Coming Soon</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 ALL PAYMENT HANZ STORE</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script>
        // Copy to Clipboard Function
        function copyToClipboard(text, method) {
            // Try modern API first
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`Nomor ${method} berhasil disalin!`);
                }).catch(() => {
                    fallbackCopy(text, method);
                });
            } else {
                fallbackCopy(text, method);
            }
        }

        // Fallback copy method for older browsers
        function fallbackCopy(text, method) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Nomor ${method} berhasil disalin!`);
            } catch (err) {
                console.error('Fallback copy failed:', err);
            }
            document.body.removeChild(textArea);
        }

        // Show Toast Notification
        function showToast(message) {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toastContainer.appendChild(toast);

            // Auto remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => {
                    toastContainer.removeChild(toast);
                }, 300);
            }, 2500);
        }

        // Download QRIS Function
        function downloadQRIS() {
            const link = document.createElement('a');
            link.href = 'assets/qris.jpg';
            link.download = 'QRIS-HANZ-STORE.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('QRIS berhasil diunduh!');
        }

        // Long press handler untuk save image di mobile
        let longPressTimer;
        const qrisImage = document.getElementById('qrisImage');

        qrisImage.addEventListener('touchstart', (e) => {
            longPressTimer = setTimeout(() => {
                downloadQRIS();
            }, 1500);
        });

        qrisImage.addEventListener('touchend', () => {
            clearTimeout(longPressTimer);
        });

        qrisImage.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
        });

        // Context menu handler untuk desktop
        qrisImage.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return true;
        });
    </script>
</body>
</html>
